apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "platformcore.labels" . | nindent 4 }}
    app.kubernetes.io/component: fastapi
spec:
  replicas: {{ .Values.fastapi.replicas }}
  selector:
    matchLabels:
      {{- include "platformcore.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: fastapi
  template:
    metadata:
      labels:
        {{- include "platformcore.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: fastapi
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/fastapi/configmap.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.fastapi.serviceAccount.name }}
      containers:
        - name: fastapi
          image: {{ .Values.fastapi.image.repository }}:{{ .Values.fastapi.image.tag }}
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: fastapi-config
          resources:
            {{- toYaml .Values.fastapi.resources | nindent 12 }}
          # Readiness gates traffic, liveness gates the process, and the app keeps
          # two endpoints so those questions stay separable. Tuning, and why the two
          # sets of numbers differ, live in values.yaml.
          readinessProbe:
            httpGet:
              path: {{ .Values.fastapi.probes.readiness.path }}
              port: 8000
            initialDelaySeconds: {{ .Values.fastapi.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.fastapi.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.fastapi.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.fastapi.probes.readiness.failureThreshold }}
          livenessProbe:
            httpGet:
              path: {{ .Values.fastapi.probes.liveness.path }}
              port: 8000
            initialDelaySeconds: {{ .Values.fastapi.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.fastapi.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.fastapi.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.fastapi.probes.liveness.failureThreshold }}
