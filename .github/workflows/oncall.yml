name: on-call agent

# Tests, chart and Terraform checks on every agent change. On main it also builds the image,
# pushes it to ECR and writes the tag into values-eks.yaml, where Argo CD picks it up.
# Nothing here calls Bedrock.
on:
  push:
    branches: ["main", "feat/oncall**"]
    paths:
      - "oncall/**"
      - "terraform/**"
      - ".github/workflows/oncall.yml"
  pull_request:
    paths:
      - "oncall/**"
      - "terraform/**"

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  ONCALL_REPO: 316053082971.dkr.ecr.us-east-1.amazonaws.com/platformcore-oncall

jobs:
  test:
    name: on-call tests
    runs-on: ubuntu-latest
    services:
      # The store tests need a real Postgres; without one they skip, and a green run
      # that skipped them proves nothing about the journal or the shipper.
      postgres:
        image: postgres:17   # the major RDS runs (17.11)
        env:
          POSTGRES_USER: oncall
          POSTGRES_DB: oncall
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U oncall"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ONCALL_STORE_HOST: 127.0.0.1
      ONCALL_STORE_PORT: "5433"
      ONCALL_STORE_SSLMODE: disable
      # Turns a store-test skip into a failure: the service above is part of this job,
      # so an unreachable store means the job is broken, not that the test is optional.
      ONCALL_REQUIRE_STORE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # the version the development venv runs
          cache: pip
          cache-dependency-path: oncall/requirements.txt

      - name: Install
        run: pip install -r oncall/requirements.txt

      # The Prometheus the cluster runs (kube-prometheus-stack 86.1.0), so rules are tested
      # by the same evaluator that will load them. test_observability runs promtool when
      # it is on PATH and skips otherwise.
      - name: Install promtool
        env:
          PROM_VERSION: "3.12.0"
        run: |
          curl -sSfL -o /tmp/prom.tgz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
          tar -xzf /tmp/prom.tgz -C /tmp
          echo "/tmp/prometheus-${PROM_VERSION}.linux-amd64" >> "$GITHUB_PATH"

      - name: Test
        # No AWS credentials and no kind cluster: model calls use fakes and Stubber,
        # and the two live-cluster tests skip unless the context is kind-oncall.
        run: python -m pytest oncall/tests -q -rs

  terraform:
    name: terraform fmt and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Format
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Validate
        # No backend and no credentials: this proves the configuration is well formed
        # and internally consistent, not that a plan would apply.
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

  chart:
    name: chart lint and schema
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.19.0

      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: v0.7.0
        run: |
          curl -sSfL -o /tmp/kc.tgz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kc.tgz -C /tmp
          echo "/tmp" >> "$GITHUB_PATH"

      - name: Lint and validate both targets
        run: make -C oncall chart-check

  build-and-push:
    name: image to ECR
    needs: [test, chart]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: aws-actions/amazon-ecr-login@v2

      # amd64: the EKS node group. The repository is IMMUTABLE, so a re-run of the same
      # commit fails at push rather than replacing the image a running pod was built from.
      - name: Build and push
        run: |
          docker build --platform linux/amd64 -t "$ONCALL_REPO:$GITHUB_SHA" oncall/
          docker push "$ONCALL_REPO:$GITHUB_SHA"

  update-image-tag:
    name: tag into values-eks.yaml
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: main-tag-commits
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Scoped to the tag line right after the repository line, as the app workflow does.
      - name: Write the tag
        run: |
          sed -i '/platformcore-oncall$/{n;s|tag: .*|tag: "'"$GITHUB_SHA"'"|}' oncall/deploy/chart/values-eks.yaml
          grep -A1 'platformcore-oncall$' oncall/deploy/chart/values-eks.yaml

      # Rebase first: a commit touching both trees runs both workflows, and each pushes a
      # tag commit to main.
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add oncall/deploy/chart/values-eks.yaml
          git commit -m "ci: update oncall image tag to $GITHUB_SHA [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
