name: on-call agent

# Branch pushes only. The agent merges to main when it is deployable, and main's own
# workflow builds and syncs images; nothing here deploys or calls Bedrock.
on:
  push:
    branches: ["feat/oncall**"]
    paths:
      - "oncall/**"
      - "terraform/**"
      - ".github/workflows/oncall.yml"
  pull_request:
    paths:
      - "oncall/**"
      - "terraform/**"

permissions:
  contents: read

jobs:
  test:
    name: on-call tests
    runs-on: ubuntu-latest
    services:
      # The store tests need a real Postgres; without one they skip, and a green run
      # that skipped them proves nothing about the journal or the shipper.
      postgres:
        image: postgres:16   # the major the dev compose store and RDS run
        env:
          POSTGRES_USER: oncall
          POSTGRES_DB: oncall
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U oncall"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ONCALL_STORE_HOST: 127.0.0.1
      ONCALL_STORE_PORT: "5433"
      ONCALL_STORE_SSLMODE: disable
      # Turns a store-test skip into a failure: the service above is part of this job,
      # so an unreachable store means the job is broken, not that the test is optional.
      ONCALL_REQUIRE_STORE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"   # the version the development venv runs
          cache: pip
          cache-dependency-path: oncall/requirements.txt

      - name: Install
        run: pip install -r oncall/requirements.txt

      # The Prometheus the cluster runs (kube-prometheus-stack 86.1.0), so rules are tested
      # by the same evaluator that will load them. test_observability runs promtool when
      # it is on PATH and skips otherwise.
      - name: Install promtool
        env:
          PROM_VERSION: "3.12.0"
        run: |
          curl -sSfL -o /tmp/prom.tgz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROM_VERSION}/prometheus-${PROM_VERSION}.linux-amd64.tar.gz"
          tar -xzf /tmp/prom.tgz -C /tmp
          echo "/tmp/prometheus-${PROM_VERSION}.linux-amd64" >> "$GITHUB_PATH"

      - name: Test
        # No AWS credentials and no kind cluster: model calls use fakes and Stubber,
        # and the two live-cluster tests skip unless the context is kind-oncall.
        run: python -m pytest oncall/tests -q -rs

  terraform:
    name: terraform fmt and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Format
        run: terraform -chdir=terraform fmt -check -recursive

      - name: Validate
        # No backend and no credentials: this proves the configuration is well formed
        # and internally consistent, not that a plan would apply.
        run: |
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate
