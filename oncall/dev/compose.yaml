# Development store. Scoped to the subproject rather than the repo root, for the same
# reason oncall/.gitignore is: oncall/ should be liftable into its own repository
# without leaving dependencies behind.
#
# Port 5433, not 5432. PlatformCore's own Phase 1 compose stack publishes 5432, and two
# databases fighting over one port is a confusing first ten minutes.
#
#   docker compose --env-file oncall/.env -f oncall/dev/compose.yaml up -d
#   docker compose --env-file oncall/.env -f oncall/dev/compose.yaml down      # keeps the volume
#   docker compose --env-file oncall/.env -f oncall/dev/compose.yaml down -v   # discards it
#
# The password comes from oncall/.env, the one place a dev credential lives. It is
# applied only when the volume is first initialised: an existing volume keeps the
# password it was created with, so .env must match that.
#
# The observability profile adds Prometheus and Grafana for the journal exporter, which
# runs on the host. Versions match the vendored kube-prometheus-stack 86.1.0.
#
#   docker compose --env-file oncall/.env -f oncall/dev/compose.yaml --profile observability up -d
#
# Production is RDS. Nothing here is imported by application code — the agent reaches
# the store entirely through ONCALL_STORE_* environment variables, so moving to RDS is
# a change of configuration rather than of code.

name: oncall-dev

services:
  store:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: oncall
      POSTGRES_USER: oncall
      POSTGRES_PASSWORD: ${ONCALL_STORE_PASSWORD:?set ONCALL_STORE_PASSWORD in oncall/.env and pass --env-file oncall/.env}
      # Marginally faster startup and smaller images; the dev store holds nothing
      # anyone would miss.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    # Loopback only. Published as 5433:5432 the dev database, with its dev password,
    # was reachable from anything on the same network as the laptop.
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - store-data:/var/lib/postgresql/data
    healthcheck:
      # Tests the database is accepting connections, not merely that the process is up.
      test: ["CMD-SHELL", "pg_isready -U oncall -d oncall"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  prometheus:
    image: prom/prometheus:v3.12.0
    profiles: ["observability"]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    # The exporter listens on the host. host-gateway makes the name resolve on Linux too;
    # Docker Desktop provides it already.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus

  grafana:
    image: grafana/grafana:13.0.1-security-01
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${ONCALL_GRAFANA_ADMIN_PASSWORD:?set ONCALL_GRAFANA_ADMIN_PASSWORD in oncall/.env}
      # Read-only browsing without a login; changes still need the admin account.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/oncall-llm.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

volumes:
  store-data:
  prometheus-data:
  grafana-data:
