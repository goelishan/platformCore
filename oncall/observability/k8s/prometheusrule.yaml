# Generated by oncall/observability/render.py from prometheus/rules/oncall-llm.rules.yml.
# Edit the source and run make -C oncall obs-render; a test fails if this file drifts.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: oncall-llm
  namespace: oncall
  labels:
    app.kubernetes.io/name: oncall-agent
    app.kubernetes.io/component: observability
    release: kps
spec:
  groups:
  - name: oncall-llm
    interval: 1m
    rules:
    - record: oncall:diagnosis_latency_seconds:p50_1h
      expr: histogram_quantile(0.50, sum by (model, le) (increase(oncall_diagnosis_latency_seconds_bucket[1h])))
    - record: oncall:diagnosis_latency_seconds:p95_1h
      expr: histogram_quantile(0.95, sum by (model, le) (increase(oncall_diagnosis_latency_seconds_bucket[1h])))
    - record: oncall:diagnosis_calls:increase_1h
      expr: sum by (model) (increase(oncall_diagnosis_latency_seconds_count[1h]))
    - record: oncall:diagnoses:increase_6h
      expr: sum by (model) (increase(oncall_diagnoses_total[6h]))
    - record: oncall:diagnoses_failed:ratio_6h
      expr: "sum by (model) (increase(oncall_diagnoses_total{outcome!=\"ok\"}[6h]))\n  /\nsum by (model)\
        \ (increase(oncall_diagnoses_total[6h]))\n"
    - record: oncall:diagnoses_first_attempt_valid:ratio_24h
      expr: "sum by (model) (increase(oncall_diagnoses_first_attempt_ok_total[24h]))\n  /\nsum by (model)\
        \ (increase(oncall_diagnoses_total{outcome!=\"prompt_too_large\"}[24h]))\n"
    - record: oncall:diagnosis_cost_usd:increase_24h
      expr: sum by (model) (increase(oncall_diagnosis_cost_usd_total[24h]))
    - alert: OncallJournalExporterDown
      expr: up{job="oncall-journal"} == 0 or absent(up{job="oncall-journal"})
      for: 10m
      labels:
        severity: warning
        component: oncall-agent
      annotations:
        summary: The on-call journal exporter is not being scraped.
        description: No successful scrape of job oncall-journal for 10 minutes. Every LLM-layer alert
          below is blind until it returns.
    - alert: OncallJournalUnreadable
      expr: oncall_journal_up == 0
      for: 10m
      labels:
        severity: warning
        component: oncall-agent
      annotations:
        summary: The exporter cannot read the diagnosis journal.
        description: '{{ $labels.instance }} has reported oncall_journal_up 0 for 10 minutes. The store
          is unreachable or the query timed out; diagnoses keep journalling to the local buffer and ship
          once the store returns.'
    - alert: OncallDiagnosisLatencyHigh
      expr: "oncall:diagnosis_latency_seconds:p95_1h > 60\n  and on (model)\noncall:diagnosis_calls:increase_1h\
        \ > 4\n"
      for: 15m
      labels:
        severity: warning
        component: oncall-agent
      annotations:
        summary: Diagnosis p95 latency is above 60 s.
        description: p95 for {{ $labels.model }} over the last hour is {{ $value | humanizeDuration }}
          across at least 5 calls. Check oncall_diagnosis_attempts_total for a repair surge before blaming
          the model.
    - alert: OncallDiagnosisFailureRateHigh
      expr: "oncall:diagnoses_failed:ratio_6h > 0.2\n  and on (model)\noncall:diagnoses:increase_6h >\
        \ 4\n"
      for: 15m
      labels:
        severity: warning
        component: oncall-agent
      annotations:
        summary: More than 20% of diagnoses failed in the last 6 hours.
        description: '{{ $value | humanizePercentage }} of diagnoses for {{ $labels.model }} ended in
          an outcome other than ok. Break it down by the outcome label on oncall_diagnoses_total.'
    - alert: OncallModelErrors
      expr: sum by (model) (increase(oncall_diagnoses_total{outcome="model_error"}[30m])) > 1
      labels:
        severity: warning
        component: oncall-agent
      annotations:
        summary: Repeated Bedrock call failures.
        description: 'More than one model_error for {{ $labels.model }} in 30 minutes: throttling, an
          IAM or endpoint change, or a regional Bedrock issue. make bedrock-check names which.'
    - alert: OncallUnsafeCommandRejected
      expr: sum by (model, prompt_version) (increase(oncall_diagnoses_total{outcome="guard_rejected"}[1h]))
        > 0
      labels:
        severity: info
        component: oncall-agent
      annotations:
        summary: A diagnosis was rejected for suggesting a disallowed command.
        description: '{{ $labels.model }} on prompt v{{ $labels.prompt_version }}. The rejected command
          is in the journal row''s errors; decide whether the prompt or the allowlist is wrong.'
    - alert: OncallPromptTooLarge
      expr: sum by (model) (increase(oncall_diagnoses_total{outcome="prompt_too_large"}[6h])) > 0
      labels:
        severity: warning
        component: oncall-agent
      annotations:
        summary: An incident was not diagnosed because its evidence exceeded the prompt cap.
        description: Nothing was sent to the model. Either the bundle's fit() was bypassed or ONCALL_PROMPT_MAX_BYTES
          is below what the assembler produces.
    - alert: OncallFirstAttemptValidLow
      expr: "oncall:diagnoses_first_attempt_valid:ratio_24h < 0.8\n  and on (model)\nsum by (model) (increase(oncall_diagnoses_total{outcome!=\"\
        prompt_too_large\"}[24h])) > 9\n"
      for: 1h
      labels:
        severity: info
        component: oncall-agent
      annotations:
        summary: Fewer than 80% of diagnoses were valid on the first attempt.
        description: '{{ $value | humanizePercentage }} for {{ $labels.model }} over 24 hours. Each repair
          re-sends the whole prompt; the contract and the prompt have drifted apart. Compare against the
          latest eval report.'
    - alert: OncallCostBurnHigh
      expr: oncall:diagnosis_cost_usd:increase_24h > 5
      labels:
        severity: warning
        component: oncall-agent
      annotations:
        summary: Diagnosis spend exceeded $5 in 24 hours.
        description: '{{ $labels.model }} has spent ${{ $value | printf "%.2f" }} at list price in the
          last 24 hours. Check the diagnosis rate per incident for a loop.'
