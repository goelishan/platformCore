{{- /*
helm test oncall: the in-cluster Bedrock linkage check. From inside the cluster it must show
the IRSA role, the VPC endpoint's private addresses and one successful call; the same
script on a laptop proves only that credentials and the model work.
*/ -}}
{{- if and .Values.bedrock.enabled .Values.tests.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: oncall-bedrock-check
  labels:
    {{- include "oncall.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  restartPolicy: Never
  serviceAccountName: {{ .Values.serviceAccount.name }}
  securityContext:
    {{- include "oncall.podSecurity" . | nindent 4 }}
  containers:
    - name: bedrock-check
      image: {{ include "oncall.image" . }}
      imagePullPolicy: {{ .Values.image.pullPolicy }}
      args: ["oncall.dev.bedrock_check"]
      envFrom:
        {{- include "oncall.envFrom" . | nindent 8 }}
      securityContext:
        {{- include "oncall.containerSecurity" . | nindent 8 }}
      resources:
        requests: {cpu: 50m, memory: 256Mi}
        limits: {cpu: 250m, memory: 256Mi}
      volumeMounts:
        - {name: tmp, mountPath: /tmp}
  volumes:
    - name: tmp
      emptyDir: {}
{{- end }}
