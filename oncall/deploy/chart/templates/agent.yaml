{{- /*
The agent pod: the collection loop, sole owner of the buffer volume's lifecycle.

  - One replica and Recreate: SQLite has a single writer and an RWO volume attaches to one
    node, so a rolling update would start a second pod that can never mount the disk.
  - Guaranteed QoS (requests equal limits) and a high PriorityClass: the agent must still be
    running when the cluster it diagnoses is short of memory. The UI is a separate
    Deployment without either, so evicting it never stops collection.
  - Liveness reads the heartbeat file the loop touches on every pass. A dead API server is
    reported as unavailable sources, not fixed by a restart, so it does not fail the probe.
*/ -}}
{{- if .Values.priorityClass.create }}
apiVersion: scheduling.k8s.io/v1
kind: PriorityClass
metadata:
  name: {{ .Values.priorityClass.name }}
  labels:
    {{- include "oncall.labels" . | nindent 4 }}
value: {{ .Values.priorityClass.value }}
globalDefault: false
description: On-call agent; outlives ordinary workloads under memory pressure.
---
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oncall-data
  labels:
    {{- include "oncall.labels" . | nindent 4 }}
  annotations:
    # Removing the release keeps the buffer: it may hold rows the store never received.
    # Helm honours the first annotation, Argo CD the second.
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Delete=false
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.persistence.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: oncall-agent
  labels:
    {{- include "oncall.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "oncall.selector" . | nindent 6 }}
      app.kubernetes.io/component: agent
  template:
    metadata:
      labels:
        {{- include "oncall.selector" . | nindent 8 }}
        app.kubernetes.io/component: agent
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.serviceAccount.name }}
      priorityClassName: {{ .Values.priorityClass.name }}
      # A job in progress finishes on SIGTERM; a log collection can take most of a minute.
      terminationGracePeriodSeconds: 90
      securityContext:
        {{- include "oncall.podSecurity" . | nindent 8 }}
      containers:
        - name: agent
          image: {{ include "oncall.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["oncall.agent"]
          envFrom:
            {{- include "oncall.envFrom" . | nindent 12 }}
          {{- if .Values.webhook.enabled }}
          ports:
            - {name: webhook, containerPort: {{ .Values.webhook.port }}}
          {{- end }}
          securityContext:
            {{- include "oncall.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          startupProbe:
            exec:
              command: ["test", "-f", "/var/lib/oncall/data/heartbeat"]
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - test $(( $(date +%s) - $(stat -c %Y /var/lib/oncall/data/heartbeat) )) -lt {{ .Values.agent.heartbeatMaxAgeSeconds }}
            periodSeconds: 30
            failureThreshold: 3
          volumeMounts:
            - {name: data, mountPath: /var/lib/oncall}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: oncall-data
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
{{- if .Values.webhook.enabled }}
---
# The Alertmanager receiver. ClusterIP only: Alertmanager reaches it as
# http://oncall-agent.{{ .Release.Namespace }}.svc:{{ .Values.webhook.port }}/alertmanager.
apiVersion: v1
kind: Service
metadata:
  name: oncall-agent
  labels:
    {{- include "oncall.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  type: ClusterIP
  selector:
    {{- include "oncall.selector" . | nindent 4 }}
    app.kubernetes.io/component: agent
  ports:
    - {name: webhook, port: {{ .Values.webhook.port }}, targetPort: webhook}
{{- end }}
