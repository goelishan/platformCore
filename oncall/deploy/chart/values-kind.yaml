#--------------------------------------------------------------------------------------------------------
# ON-CALL AGENT - KIND
#--------------------------------------------------------------------------------------------------------
#
#   - the lab cluster: image loaded with make image-kind, in-cluster Postgres, no AWS identity
#
#   - collects only the fault library's namespace, as make collect does
#



image:
  repository: oncall
  pullPolicy: IfNotPresent

clusterName: kind-oncall
namespaces: [oncall-lab]
env: dev

persistence:
  storageClassName: standard

store:
  sslmode: disable
  iamAuth: false
  inCluster:
    enabled: true

# Kind has no IRSA, so no pod here has an AWS identity: Preview only, no helm test.
bedrock:
  enabled: false

# No Argo CD on the lab cluster, so no argocd namespace for the Application Role to live in.
# The webhook stays on: make deploy-kind with a local Alertmanager can exercise it.
sources:
  argocd:
    enabled: false
