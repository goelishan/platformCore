#--------------------------------------------------------------------------------------------------------
# kube-prometheus-stack overrides
#--------------------------------------------------------------------------------------------------------

prometheus:
  prometheusSpec:
    retention: 15d

    serviceMonitorSelector:
      matchLabels:
        release: kps
    podMonitorSelector:
      matchLabels:
        release: kps
    probeSelector:
      matchLabels:
        release: kps
    ruleSelector:
      matchLabels:
        release: kps

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3-delete
          accessModes: ["ReadWriteOnce"]
          resources:
            requests: 
              storage: 20Gi

    resources:
      requests:
        cpu: 200m
        memory: 400Mi
      limits:
        memory: 800Mi


# alertmanager / alertmanagerSpec, lower case: the chart's keys. The block was spelled
# alertManager before 2026-10-12, an unknown key Helm accepted in silence, so none of it
# ever applied (no PVC, no resources). Requests sit above the chart default of 200Mi.
alertmanager:
  alertmanagerSpec:
    replicas: 1

    storage: 
      volumeClaimTemplate:
        spec:
          storageClassName: gp3-delete
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
    
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 256Mi


# EKS runs the control plane; there is nothing to scrape, and the default rules would fire
# KubeControllerManagerDown and KubeSchedulerDown permanently. kube-proxy is a real
# DaemonSet on EKS and stays enabled.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false


grafana:
  persistence:
    enabled: true
    type: pvc
    storageClassName: gp3-delete
    accessModes: ["ReadWriteOnce"]
    size: 5Gi
  
  service:
    type: ClusterIP

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  ingress:
    enabled: true
    ingressClassName: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    hosts:
      - ""
    path: /
    pathType: Prefix
  
  additionalDataSources:
    - name: Loki
      type: loki
      url:  http://loki:3100
      access: proxy
      isDefault: false


prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
  
