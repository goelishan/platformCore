#--------------------------------------------------------------------------------------------------------
# kube-prometheus-stack overrides
#--------------------------------------------------------------------------------------------------------

prometheus:
  prometheusSpec:
    retention: 15d

    serviceMonitorSelector:
      matchLabels:
        release: kps
    podMonitorSelector:
      matchLabels:
        release: kps
    probeSelector:
      matchLabels:
        release: kps
    ruleSelector:
      matchLabels:
        release: kps

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3-delete
          accessModes: ["ReadWriteOnce"]
          resources:
            requests: 
              storage: 20Gi

    resources:
      requests:
        cpu: 200m
        memory: 400Mi
      limits:
        memory: 800Mi


# alertmanager / alertmanagerSpec, lower case: the chart's keys. The block was spelled
# alertManager before 2026-10-12, an unknown key Helm accepted in silence, so none of it
# ever applied (no PVC, no resources). Requests sit above the chart default of 200Mi.
alertmanager:
  alertmanagerSpec:
    replicas: 1

    storage: 
      volumeClaimTemplate:
        spec:
          storageClassName: gp3-delete
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 2Gi
    
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 256Mi

  # F9 (drill 2026-10-13): Alertmanager had no receiver, so every alert went nowhere. Now
  # firing and resolved alerts go to the on-call agent, which opens an incident and
  # diagnoses it. Watchdog and InfoInhibitor are the pipeline's own heartbeats and go to
  # the null receiver. Replaces the chart's default config, so the default inhibition of
  # warnings by a critical alert on the same object is restated here.
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: oncall-agent
      group_by: [namespace, alertname]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: "null"
          matchers: ['alertname =~ "Watchdog|InfoInhibitor"']
    receivers:
      - name: "null"
      - name: oncall-agent
        webhook_configs:
          - url: http://oncall-agent.oncall.svc:8080/alertmanager
            send_resolved: true
            max_alerts: 50
    inhibit_rules:
      - source_matchers: ['severity = "critical"']
        target_matchers: ['severity =~ "warning|info"']
        equal: [namespace, alertname]
      - source_matchers: ['severity = "warning"']
        target_matchers: ['severity = "info"']
        equal: [namespace, alertname]


# EKS runs the control plane; there is nothing to scrape, and the default rules would fire
# KubeControllerManagerDown and KubeSchedulerDown permanently. kube-proxy is a real
# DaemonSet on EKS and stays enabled.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false


grafana:
  persistence:
    enabled: true
    type: pvc
    storageClassName: gp3-delete
    accessModes: ["ReadWriteOnce"]
    size: 5Gi
  
  service:
    type: ClusterIP

  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 512Mi

  ingress:
    enabled: true
    ingressClassName: alb
    annotations:
      alb.ingress.kubernetes.io/scheme: internet-facing
      alb.ingress.kubernetes.io/target-type: ip
      alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
    hosts:
      - ""
    path: /
    pathType: Prefix
  
  additionalDataSources:
    - name: Loki
      type: loki
      url:  http://loki:3100
      access: proxy
      isDefault: false


prometheus-node-exporter:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi

kube-state-metrics:
  resources:
    requests:
      cpu: 20m
      memory: 32Mi

prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 128Mi
  
